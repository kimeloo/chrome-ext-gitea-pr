name: Release

# release로 시작하는 브랜치의 PR이 main에 머지되면 manifest.json의 버전으로 GitHub Release를 만들고
# 수동 설치용 gitea-pr-extension.zip을 첨부한다.
# 이어서 같은 ZIP을 Chrome 웹 스토어에 업로드하고 심사를 제출한다. 승인되면 자동으로 게시된다.
# 스토어 인증 정보(Secrets)가 없으면 제출 단계는 건너뛴다.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: npm test

      - name: Read version
        id: version
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8')).version")"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error file=extension/manifest.json::version '$version' 은(는) 크롬 확장 버전 형식(예: 1.2.3)이 아닙니다."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check tag does not exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "::error::태그 v${VERSION} 이(가) 이미 있습니다. manifest.json의 version을 올리세요."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error file=CHANGELOG.md::'## [${VERSION}]' 섹션이 없거나 비어 있습니다."
            exit 1
          fi

      - name: Package extension
        run: npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release create "v${VERSION}" \
            --target "$TARGET" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            dist/gitea-pr-extension.zip

  # 릴리즈 단계와 분리해 두어, 스토어 제출만 실패해도 이 작업만 다시 실행할 수 있다.
  publish-store:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check store credentials
        id: credentials
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$EXTENSION_ID" ] || [ -z "$PUBLISHER_ID" ] || [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "::warning::CWS_* Secrets가 설정되지 않아 Chrome 웹 스토어 제출을 건너뜁니다. 개발자 대시보드에서 직접 제출하세요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release package
        if: steps.credentials.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" --pattern gitea-pr-extension.zip

      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: 20

      # 명령을 생략하면 업로드 후 심사를 제출한다. 승인되면 별도 조작 없이 게시된다.
      - name: Upload and submit for review
        if: steps.credentials.outputs.ready == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli@4 --source gitea-pr-extension.zip
